<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | GOD PEOPLE GATHERING</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">✝</div>
        <div class="logo-text">
          GOD PEOPLE GATHERING
          <span>Where Faith Meets Community</span>
        </div>
      </a>
      <button class="menu-toggle" aria-label="Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="bible-school.html">Bible School</a></li>
        <li><a href="newsletter.html">Newsletter</a></li>
        <li><a href="book.html">Inspired By God</a></li>
        <li class="hidden" data-auth><span class="member-badge">👤 <span data-member-name></span></span></li>
        <li class="hidden" data-auth><a href="#" onclick="logout(); return false;">Logout</a></li>
        <li data-guest><a href="login.html" class="btn-auth">Login</a></li>
        <li data-guest><a href="signup.html" class="btn-auth active">Sign Up</a></li>
      </ul>
    </div>
  </header>

  <main class="main">
    <div class="auth-container">
      <div class="auth-card">
        <h2>Join Our Family</h2>
        <p class="subtitle">Create your free member account</p>
        <form id="signup-form">
          <div class="form-group">
            <label for="signup-name">Full Name</label>
            <input type="text" id="signup-name" required placeholder="Your name">
          </div>
          <div class="form-group">
            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" required placeholder="At least 6 characters" minlength="6">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
          <p id="signup-message" class="form-success"></p>
        </form>
        <p class="auth-switch">
          Already a member? <a href="login.html">Login here</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 GOD PEOPLE GATHERING. All glory to God.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
